<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unravelled</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="header">
  <div class="wordmark">Unravelled<span class="dot">.</span></div>
  <div id="langWrap">
    <button id="langBtn" aria-haspopup="true" aria-expanded="false">EN</button>
    <div id="langMenu" hidden></div>
  </div>
</header>

<main id="stage">
  <section id="frontPage" class="screen active">
    <h1 class="big serif">Unravelled<span class="dot">.</span></h1>
    <div class="input-row">
      <input id="linkInput" type="text" autocomplete="off" spellcheck="false">
      <button id="unravelBtn" class="primary" type="button"></button>
    </div>
    <div id="frontError" class="notice" hidden><span id="frontErrorText"></span><button id="retryBtn" type="button"></button></div>
    <div id="manualWrap" hidden>
      <p id="manualText"></p>
      <textarea id="manualInput" rows="6"></textarea>
      <button id="manualBtn" type="button" class="primary"></button>
    </div>
    <div id="frontBallSlot"></div>
    <p id="loadingLine" class="hint-pulse" hidden></p>
  </section>

  <section id="page1" class="screen story"><div class="art"></div><article class="card"><p class="card-label"></p><h2 class="scene-title serif"></h2><blockquote class="quote"></blockquote><div class="quote-attr muted"></div></article></section>
  <section id="page2" class="screen story"><div class="art"></div><article class="card"><p class="card-label"></p><h2 class="scene-title serif"></h2><p class="era-season muted"></p><p class="era-feel"></p></article></section>
  <section id="page3" class="screen story"><div class="art"></div><article class="card"><p class="card-label"></p><h3 class="twin-name serif"></h3><p class="src muted"></p><p class="why"></p></article></section>
  <section id="page4" class="screen story"><div class="art"></div><article class="card"><p class="card-label"></p><h3 class="twin-name serif"></h3><p class="why"></p></article></section>
  <section id="page5" class="screen story"><div class="art"></div><article class="card"><p class="card-label"></p><h3 class="twin-name serif"></h3><p class="why"></p></article></section>
  <section id="page6" class="screen story"><div class="art"></div><article class="card center"><p class="card-label"></p><h2 class="scene-title serif"></h2><button id="anotherBtn" type="button" class="primary"></button></article></section>
</main>

<nav id="controls">
  <button id="backBtn" type="button" class="ghost"></button>
  <div id="dots"></div>
  <button id="nextBtn" type="button" class="ghost"></button>
</nav>

<div id="dock">
  <div id="ballSlot"></div>
  <svg id="threadSvg" preserveAspectRatio="none"></svg>
  <div id="catRow"></div>
</div>

<div id="toast" aria-live="polite"></div>

<script src="art/lists.js"></script>
<script src="art/engine.js"></script>
<script src="art/scenes_a.js"></script>
<script src="art/scenes_b.js"></script>
<script src="art/icons.js"></script>
<script src="art/figures.js"></script>
<script src="art/posters.js"></script>
<script src="art/activities.js"></script>
<script src="art/cats.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
