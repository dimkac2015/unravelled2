<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unravelled — see your playlist differently</title>
<meta name="description" content="Paste a Spotify playlist link and unravel it into a scenery, an era, a character and a movie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23e8dcC8'/%3E%3Cpath d='M6 16c4-6 8 4 12-2 3-4 6 2 8-1' stroke='%232e5d43' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<div id="thread-line" aria-hidden="true"></div>

<div id="yarn-ball" aria-hidden="true">
  <svg viewBox="0 0 120 120" id="yarn-svg">
    <defs>
      <clipPath id="ball-clip"><circle cx="60" cy="60" r="46"/></clipPath>
    </defs>
    <circle cx="60" cy="60" r="46" fill="#e8dcc8"/>
    <g clip-path="url(#ball-clip)" stroke="#2e5d43" stroke-width="4.5" fill="none" stroke-linecap="round">
      <path d="M14 60 C 34 30, 86 30, 106 60"/>
      <path d="M14 60 C 34 90, 86 90, 106 60"/>
      <path d="M22 38 C 52 66, 68 54, 98 82"/>
      <path d="M22 82 C 52 54, 68 66, 98 38"/>
      <path d="M60 14 C 30 34, 30 86, 60 106"/>
      <path d="M40 20 C 70 44, 50 76, 80 100"/>
    </g>
    <circle cx="60" cy="60" r="46" fill="none" stroke="#1d3f2c" stroke-width="3"/>
  </svg>
</div>

<main id="app">

  <!-- FRONT PAGE -->
  <section class="page" id="page-home">
    <header class="site-header">
      <h1 class="site-title">Unravelled</h1>
      <p class="tagline">paste a playlist. pull the thread.</p>
    </header>

    <div class="paste-frame">
      <label for="playlist-input" class="frame-label">your spotify playlist link</label>
      <input id="playlist-input" type="url" placeholder="https://open.spotify.com/playlist/…"
             autocomplete="off" spellcheck="false">
      <p class="input-error" id="input-error" hidden></p>
      <button id="unravel-btn" class="unravel-btn">
        <span class="btn-thread" aria-hidden="true"></span>
        unravel
      </button>
      <p id="status-msg" class="status-msg" hidden></p>
    </div>

    <div class="home-foot">
      <button class="linklike" id="demo-toggle">try a demo playlist</button>
    </div>

    <div class="demo-list" id="demo-list" hidden>
      <p class="settings-note">No keys? Unravel a demo playlist:</p>
      <div class="demo-buttons">
        <button class="small-btn demo-btn" data-demo="storm">“Thunder in the Cathedral” — dark &amp; heavy</button>
        <button class="small-btn demo-btn" data-demo="summer">“Sunburnt Cassette” — sunny &amp; nostalgic</button>
        <button class="small-btn demo-btn" data-demo="lush">“Moss &amp; Bramble” — lush &amp; slow</button>
      </div>
    </div>
  </section>

  <!-- SCENERY PAGE -->
  <section class="page" id="page-scenery" hidden>
    <div class="scene-stage" id="scene-stage"></div>
    <div class="page-body" id="scenery-body"></div>
  </section>

  <!-- ERA PAGE -->
  <section class="page" id="page-era" hidden>
    <div class="page-body era-body" id="era-body"></div>
  </section>

  <!-- CHARACTER PAGE -->
  <section class="page" id="page-character" hidden>
    <div class="page-body char-body" id="character-body"></div>
  </section>

  <!-- MOVIE PAGE -->
  <section class="page" id="page-movie" hidden>
    <div class="page-body movie-body" id="movie-body"></div>
  </section>

  <!-- FINALE -->
  <section class="page" id="page-end" hidden>
    <div class="page-body end-body" id="end-body"></div>
  </section>

</main>

<footer class="site-footer">
  <p>Unravelled — a playlist, unspooled. Not affiliated with Spotify.</p>
</footer>

<script>window.UNRAVELLED_VERSION = 3;</script>
<script src="js/demo-data.js?v=3"></script>
<script src="js/scenes.js?v=3"></script>
<script src="js/portraits.js?v=3"></script>
<script src="js/cats.js?v=3"></script>
<script src="js/app.js?v=3"></script>
<script>
// Self-heal: the current app.js sets UNRAVELLED_LOADED when it runs. If a
// stale cached app.js was served instead, it won't — so reload once with a
// cache-buster to pull the current code.
window.addEventListener("DOMContentLoaded", function () {
  if (window.UNRAVELLED_LOADED !== 3 && !/[?&]r=/.test(location.search)) {
    location.replace(location.pathname + "?r=" + Date.now());
  }
});
</script>
</body>
</html>
